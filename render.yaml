services:
  - type: web
    name: dermasmart-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: dermasmart
      - key: GEMINI_API_KEY
        sync: false
