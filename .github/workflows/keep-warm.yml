name: Keep backend warm

# The backend sleeps after ~15 minutes without traffic, and waking it takes up
# to a minute. Pinging /health on a schedule keeps the instance running so the
# live demo responds immediately whenever someone opens it.

on:
  schedule:
    # Every 10 minutes. GitHub queues scheduled runs under load, so treat this
    # as "roughly every 10 minutes", not a guarantee.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          # --max-time 90 leaves room for a cold start to finish. A non-200
          # fails the run so GitHub flags it — a warning alone let the backend
          # sit unreachable for days while every run still showed "success".
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
            "https://dermasmart-dnuj.onrender.com/health" || echo "000")
          echo "Backend responded with HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Backend did not return 200 (got $code)"
            exit 1
          fi
